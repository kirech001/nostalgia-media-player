[package]
name = "kirech-media-player"
version = "0.8.0"
edition = "2021"
description = "A nostalgic Windows Media Player 8 style media player"

[dependencies]
wry = "0.57.3"
tao = "0.37.3"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
